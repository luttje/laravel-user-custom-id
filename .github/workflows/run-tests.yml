name: run-tests

on:
  push:
    paths:
    - "**.php"
    - ".github/workflows/run-tests.yml"
    - "phpunit.xml.dist"
    - "composer.json"
    - "composer.lock"
  # No path filter here: the "tests-passed" job below is meant to be a required
  # status check, and a required check that never runs would block the PR.
  pull_request:


permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.5, 8.4, 8.3 ]
        laravel: [ 12.*, 13.* ]
        stability: [ prefer-lowest, prefer-stable ]
        include:
        - laravel: 12.*
          testbench: ^10.0
          phpunit: 11.*
        - laravel: 13.*
          testbench: ^11.0
          phpunit: 12.*
        exclude:
        - laravel: 11.*
          php: 8.1

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: xdebug

    - name: Setup problem matchers
      run: |
        echo "::add-matcher::${{ runner.tool_cache }}/php.json"
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Install dependencies
      run: |
        composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
        composer update --${{ matrix.stability }} --prefer-dist --no-interaction

    - name: List Installed Dependencies
      run: composer show -D

    - name: Execute tests
      run: composer test-ci
      env:
        RUNNING_IN_CI: true

    - name: Send coverage to Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        parallel: true

  # Single job that summarises the whole matrix, so branch protection only
  # needs to require one check name.
  tests-passed:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Fail unless every matrix job succeeded
      if: ${{ needs.test.result != 'success' }}
      run: exit 1

  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        parallel-finished: true
